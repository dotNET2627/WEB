name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: Build & Test (.NET ${{ env.DOTNET_VERSION }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build (no-restore)
        run: dotnet build --no-restore --configuration Release

      - name: Run tests
        run: >
          dotnet test --no-build --configuration Release
          --verbosity normal
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./test-results/*.trx
          retention-days: 7

  frontend:
    name: Build & Test (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: node --test tests/unit/otp-rate-limit.test.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Run production browser tests
        env:
          PLAYWRIGHT_PRODUCTION: "1"
        run: |
          npm run start &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          timeout 30 bash -c 'until curl -fsS http://localhost:3000/portal/login >/dev/null; do sleep 1; done'
          npx playwright test

  docker-build:
    name: Docker Build (smoke test)
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -f src/DentalManagement.Api/Dockerfile \
            -t dental-api:ci-${{ github.sha }} \
            .
