name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: Build & Test (.NET ${{ env.DOTNET_VERSION }})
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:8.0
        ports:
          - "27017:27017"
        options: >-
          --health-cmd "mongosh --quiet --eval \"try{rs.status().ok}catch(e){0}\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 40s

      redis:
        image: redis:7.4-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # Initialise MongoDB replica set (needed for transactions)
      - name: Init MongoDB replica set
        run: |
          docker exec $(docker ps -q --filter "ancestor=mongo:8.0") mongosh --quiet \
            --eval "try { rs.status() } catch(e) { rs.initiate({ _id:'rs0', members:[{_id:0,host:'localhost:27017'}] }) }"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build (no-restore)
        run: dotnet build --no-restore --configuration Release

      - name: Run tests
        run: >
          dotnet test --no-build --configuration Release
          --verbosity normal
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./test-results
        env:
          MongoDb__ConnectionString: "mongodb://localhost:27017/?replicaSet=rs0"
          MongoDb__DatabaseName: "DentalManagementTest"
          Redis__ConnectionString: "localhost:6379"
          Redis__InstanceName: "dental-test:"
          Jwt__SecretKey: "ci-test-secret-key-at-least-32-chars!!"
          Jwt__Issuer: "DentalManagement.Api"
          Jwt__Audience: "DentalManagement.Client"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./test-results/*.trx
          retention-days: 7

  docker-build:
    name: Docker Build (smoke test)
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -f src/DentalManagement.Api/Dockerfile \
            -t dental-api:ci-${{ github.sha }} \
            .
