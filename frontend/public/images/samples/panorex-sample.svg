    <rect x="404" y="130" width="26" height="52" rx="4" />
    <rect x="438" y="132" width="22" height="48" rx="4" />
    <rect x="466" y="135" width="24" height="44" rx="4" />
    <rect x="496" y="138" width="25" height="40" rx="4" />
    <rect x="526" y="140" width="24" height="38" rx="4" />
    <rect x="556" y="140" width="22" height="35" rx="4" />
  </g>

  <!-- Lower row -->
  <g fill="#CBD5E1" opacity="0.85">
    <rect x="230" y="195" width="22" height="36" rx="4" />
    <rect x="258" y="195" width="24" height="38" rx="4" />
    <rect x="288" y="192" width="25" height="40" rx="4" />
    <rect x="318" y="188" width="22" height="44" rx="4" />
    <rect x="346" y="185" width="20" height="46" rx="4" />
    <rect x="372" y="184" width="24" height="48" rx="4" />
    <rect x="404" y="184" width="24" height="48" rx="4" />
    <rect x="432" y="185" width="20" height="46" rx="4" />
    <rect x="458" y="188" width="22" height="44" rx="4" />
    <rect x="486" y="192" width="25" height="40" rx="4" />
    <rect x="516" y="195" width="24" height="38" rx="4" />
    <rect x="546" y="195" width="22" height="36" rx="4" />
