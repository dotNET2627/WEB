  <line x1="400" y1="50" x2="400" y2="400" stroke="#1E293B" stroke-width="1" stroke-dasharray="4" />
  <!-- Stylized Panoramic Mandible / Maxilla Arch -->
  <path d="M 120 180 Q 400 350 680 180 Q 400 280 120 180" fill="#1E293B" opacity="0.6" />
  <path d="M 140 160 Q 400 90 660 160 Q 400 130 140 160" fill="#1E293B" opacity="0.6" />
  
  <!-- Stylized Teeth silhouettes -->
  <!-- Upper row -->
  <g fill="#E2E8F0" opacity="0.85">
    <rect x="220" y="140" width="22" height="35" rx="4" />
    <rect x="250" y="140" width="24" height="38" rx="4" />
    <rect x="280" y="138" width="25" height="40" rx="4" />
    <rect x="312" y="135" width="24" height="44" rx="4" />
