  <!-- Impacted wisdom tooth (48) representation -->
  <rect x="200" y="210" width="24" height="36" rx="4" fill="#F87171" opacity="0.9" transform="rotate(75 212 228)" />

  <!-- Labels -->
  <text x="30" y="40" fill="#94A3B8" font-family="monospace" font-size="14" font-weight="bold">PANORAMIC DENTAL X-RAY (PANOREX)</text>
  <text x="30" y="65" fill="#64748B" font-family="sans-serif" font-size="12">CHẾ ĐỘ: TOÀN CẢNH HÀM RĂNG • QUY CÁCH: CHẨN ĐOÁN KỸ THUẬT SỐ</text>
  <text x="680" y="40" fill="#38BDF8" font-family="monospace" font-size="14" font-weight="bold">R: PHẢI</text>
  <text x="740" y="40" fill="#38BDF8" font-family="monospace" font-size="14" font-weight="bold">L: TRÁI</text>
  <text x="710" y="420" fill="#64748B" font-family="monospace" font-size="11">DICOM 3.0</text>
