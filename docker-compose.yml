services:
  # ── MongoDB (pseudo replica-set – enables multi-document transactions) ────────
  mongo:
    image: mongo:8.0
    container_name: dental_mongo
    entrypoint:
      - /bin/bash
      - -c
      - |
        cp /tmp/mongo-keyfile /etc/mongo-keyfile
        chmod 400 /etc/mongo-keyfile
        chown mongodb:mongodb /etc/mongo-keyfile
        exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /etc/mongo-keyfile
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
      MONGO_INITDB_DATABASE: DentalManagement
    volumes:
      - mongo_data:/data/db
      - ./infra/mongo/keyfile:/tmp/mongo-keyfile:ro
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --username
        - root
        - --password
        - ${MONGO_ROOT_PASSWORD}
        - --authenticationDatabase
        - admin
        - --eval
        - "try { rs.status().ok } catch(e) { 0 }"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  # One-shot container to initialise the replica set on first run
  mongo-rs-init:
    image: mongo:8.0
    container_name: dental_mongo_rs_init
    depends_on:
      mongo:
        condition: service_healthy
    command: >
      mongosh --host mongo:27017
        --username root
        --password ${MONGO_ROOT_PASSWORD}
        --authenticationDatabase admin
        --eval "
          try { rs.status(); print('Replica set already initialized'); }
          catch(e) {
            rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] });
            print('Replica set initialized');
          }
        "
    restart: "no"

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: dental_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Web API ───────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: src/DentalManagement.Api/Dockerfile
    container_name: dental_api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      MongoDb__ConnectionString: "${MONGO_CONNECTION_STRING:-mongodb://root:${MONGO_ROOT_PASSWORD}@mongo:27017/DentalManagement?authSource=admin&replicaSet=rs0}"
      MongoDb__DatabaseName: DentalManagement
      Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD}"
      Redis__InstanceName: "dental:"
      Jwt__SecretKey: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      Jwt__Issuer: DentalManagement.Api
      Jwt__Audience: DentalManagement.Client
      Frontend__Origin: ${FRONTEND_ORIGIN:-http://localhost:3000}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${API_PORT:-5000}:8080"
    restart: unless-stopped

volumes:
  mongo_data:
  redis_data:
